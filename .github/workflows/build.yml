name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files and icon
        run: |
          mkdir -p www resources
          cp index.html www/index.html
          cp icon.png resources/icon.png

      - name: Install dependencies
        run: npm install

      - name: Add file save and share plugins
        run: |
          M=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install @capacitor/filesystem@latest-$M @capacitor/share@latest-$M || echo "Plugins unavailable, app will use fallbacks"

      - name: Generate Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#f5f6f7' --iconBackgroundColorDark '#15181c'
          npx cap sync android

      - name: Set version
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.1.${{ github.run_number }}"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baseline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
