<style>

:root[data-theme="dark"]{--bg:#15181c;--sf:#1e2227;--tx:#e8eaed;--mu:#98a0ab;--ln:#2d333a;--ac:#8fb0e3;--ac2:#243044;--ok:#6cc58f;--bad:#e5836f;--warn:#dcb25c;--org:#f0a45a;color-scheme:dark}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px}
.stat b{display:block;font-size:19px;font-weight:650}.stat span,.mu{color:var(--mu);font-size:12.5px}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 3px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;min-height:40px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{margin-bottom:8px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:9px 12px;min-height:40px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.p{color:#10151c}}
button.x{border:0;background:none;color:var(--mu);padding:4px 8px;min-height:32px}

.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.li:first-of-type{border-top:0}
.li div:first-child{min-width:0}

.empty{color:var(--mu);margin:6px 0}
svg.ch{width:100%;height:auto;display:block}
.ch text{fill:var(--mu);font-size:10px}.ch .g{stroke:var(--ln)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;border-radius:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:8px 2px;min-height:54px}

.big{font-size:26px;font-weight:650}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.hd{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.hd h1{margin:0;font-weight:800}
.logo,.ti{fill:none;stroke-linecap:round;stroke-linejoin:round}.logo{width:30px;height:30px;stroke:var(--tx);stroke-width:2}.ti{width:46px;height:46px;stroke:var(--ac);stroke-width:1.6}
.stat b,.big{font-weight:800}
.ov{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:50}
.tc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;max-width:420px;width:100%;padding:20px;margin-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.tc h2{font-size:19px;margin:10px 0 6px;font-weight:800}.tc p{margin:0;color:var(--mu)}
.dots{display:flex;gap:6px;margin:14px 0}.dots i{width:7px;height:7px;border-radius:99px;background:var(--ln)}.dots i.on{background:var(--ac);width:18px}

button{transition:transform .12s,background .2s,border-color .2s}button:active{transform:scale(.96)}
.enter{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
.bar i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.ch .ln{stroke-dasharray:1;animation:draw 1s ease-out both}.ch circle{animation:fade .5s .7s both}
.ch rect{transform-box:fill-box;transform-origin:bottom;animation:up .7s cubic-bezier(.2,.7,.2,1) both}
.ov{animation:fade .2s}.tc{animation:pop .3s cubic-bezier(.2,.7,.2,1)}
nav button.on svg{animation:bump .35s}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--sf));border-radius:10px;padding:12px;margin-bottom:12px}
.alert .dot{width:10px;height:10px;border-radius:99px;background:var(--c);margin-top:5px;flex:none}
.alert b{display:block;color:var(--c)}.alert span{font-size:13.5px}
.alert[style*="--bad"] .dot{animation:pulse 1.6s infinite}
.sr{margin-top:4px;border:1px solid var(--ln);border-radius:8px;overflow:hidden}.sr:empty{display:none}.sr .empty{padding:8px 10px;margin:0}
.sri{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;border-top:1px solid var(--ln);border-radius:0;text-align:left;background:var(--sf)}.sri:first-child{border-top:0}
.sw{display:flex;gap:10px;margin-bottom:6px}.sw button{width:38px;height:38px;border-radius:99px;padding:0;border:3px solid var(--sf);box-shadow:0 0 0 1px var(--ln)}.sw button.on{box-shadow:0 0 0 2px var(--tx)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}}@keyframes grow{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}}@keyframes up{from{transform:scaleY(0)}}
@keyframes bump{50%{transform:translateY(-3px) scale(1.12)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,64,47,.55)}70%,100%{box-shadow:0 0 0 8px rgba(179,64,47,0)}}
body.noanim *,body.noanim *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.hd{display:flex;align-items:center}.gear{margin-left:auto;width:40px;height:40px;padding:0;border-radius:99px;display:grid;place-items:center}.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#rt{display:none;position:fixed;left:8px;right:8px;bottom:72px;z-index:20}
#rt.on{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:pop .3s}
#rt span{display:flex;gap:6px}#rt button{padding:6px 10px;min-height:0}details summary{cursor:pointer}
</style>

<main><div class="hd"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-8-5-8-10.8A4.6 4.6 0 0112 7a4.6 4.6 0 018 2.7c0 5.8-8 10.8-8 10.8z M4 12h4l2-3.5 3 6.5 2-3h5"/></svg><h1 id="t"></h1><button class="gear" aria-label="Settings" onclick="go('set')"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg></button></div><div id="v"></div></main>
<nav id="nav"></nav><div id="rt"></div>
<script>
var SEED=[["Chicken breast, cooked",165,31,0,3.6],["Egg, whole",143,12.6,.7,9.5],["White rice, cooked",130,2.7,28,.3],["Oats, dry",389,16.9,66,6.9],["Whole milk",61,3.2,4.8,3.3],["Greek yogurt, nonfat",59,10,3.6,.4],["Banana",89,1.1,23,.3],["Apple",52,.3,14,.2],["Salmon, cooked",206,22,0,12],["Ground beef 90%, cooked",250,26,0,15],["Tuna, canned",116,26,0,1],["Broccoli",34,2.8,7,.4],["Sweet potato, baked",90,2,21,.2],["Potato, boiled",87,1.9,20,.1],["Pasta, cooked",158,5.8,31,.9],["White bread",265,9,49,3.2],["Olive oil",884,0,0,100],["Peanut butter",588,25,20,50],["Almonds",579,21,22,50],["Cheddar cheese",403,25,1.3,33],["Whey protein powder",400,80,8,6],["Tofu, firm",144,17,3,9],["Lentils, cooked",116,9,20,.4],["Black beans, cooked",132,8.9,24,.5],["Avocado",160,2,9,15],["Cottage cheese",98,11,3.4,4.3]];
var K="baseline1",S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}

S.st=Object.assign({bu:'kg',lu:'kg',theme:'auto',ac:'blue',anim:1,warn:1,rest:90},S.st||{});S.eu=S.eu||{};S.meals=S.meals||[];S.day=S.day||{};S.st.since=S.st.since||Date.now();

var IC={weight:"M4 5h16v14H4z M8 10a4 4 0 018 0",lifts:"M3 9v6M7 6v12M17 6v12M21 9v6M7 12h10",food:"M3 11h18a9 9 0 01-18 0z M9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4",db:"M5 6h14M5 12h14M5 18h14",me:"M12 12a4 4 0 100-8 4 4 0 000 8z M4 21a8 8 0 0116 0",set:"M12 15a3 3 0 100-6 3 3 0 000 6z M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"};
var TABS=[["weight","Weight"],["lifts","Strength"],["food","Intake"],["db","Foods"],["me","Profile"]];

/* targets */
function latestW(){if(!S.w.length)return null;return S.w.slice().sort(function(a,b){return a.d<b.d?-1:1}).pop().kg}
function T(){var w=latestW();if(!w)return null;var p=S.p;
var bmr=10*w+6.25*p.h-5*p.age+(p.sex==="m"?5:-161),tdee=p.tdeeO>0?p.tdeeO:bmr*p.act,dir=p.goal==="lose"?-1:p.goal==="gain"?1:0;
return{w:w,bmr:bmr,tdee:tdee,target:tdee+dir*p.rate*1100,prot:p.ppk*w}}

/* chart */
function chart(raw,tr,labs,unit){
if(raw.length<2)return '<p class="empty">Log at least two entries to see a chart.</p>';
var W=320,H=170,l=34,r=8,t=10,b=22,n=raw.length,all=raw.concat(tr||[]),mn=Math.min.apply(0,all),mx=Math.max.apply(0,all);

s+='<text x="'+l+'" y="'+(H-6)+'">'+labs[0]+'</text><text x="'+(W-r)+'" y="'+(H-6)+'" text-anchor="end">'+labs[n-1]+'</text></svg>';
return s}

/* weight */
function wSeries(){
var a=S.w.slice().sort(function(x,y){return x.d<y.d?-1:1}),raw,tr,lb;
if(wr==="day"){var fe=ema(a.map(function(x){return x.kg})).slice(-30);a=a.slice(-30);raw=a.map(function(x){return x.kg});
tr=fe;lb=a.map(function(x){return lab(x.d)})}
else{var m={},o=[];a.forEach(function(x){var k;if(wr==="week"){var d=pd(x.d);d.setDate(d.getDate()-(d.getDay()+6)%7);k=ymd(d)}else k=x.d.slice(0,7);if(!m[k]){m[k]=[];o.push(k)}m[k].push(x.kg)});
o=o.slice(-12);raw=o.map(function(k){return avg(m[k])});tr=null;
lb=o.map(function(k){return wr==="week"?lab(k):pd(k+"-01").toLocaleDateString(undefined,{month:"short",year:"2-digit"})})}
return{raw:raw.map(bv),tr:tr&&tr.map(bv),lb:lb}}
function vWeight(){
var s=wSeries(),all=S.w.slice().sort(function(x,y){return x.d<y.d?-1:1}),cur=all.length?all[all.length-1].kg:null;
var last7=all.filter(function(x){return x.d>addD(td(),-7)}).map(function(x){return x.kg}),prev7=all.filter(function(x){return x.d<=addD(td(),-7)&&x.d>addD(td(),-14)}).map(function(x){return x.kg});
var wk=last7.length&&prev7.length?avg(last7)-avg(prev7):null,rc=s.raw.length>1?s.raw[s.raw.length-1]-s.raw[0]:null;

function addW(){var d=$("wd").value,k=num("wk")/(bu()==="lb"?LB:1);if(!d||!(k>20&&k<400)){alert("Enter a date and a weight between 20 and 400 kg.");return}
S.w=S.w.filter(function(x){return x.d!==d});S.w.push({d:d,kg:k});save();render()}

/* strength */
function e1(kg,r){return r<=1?kg:kg*(1+r/30)}
function sessions(ex){var m={};S.l.filter(function(x){return x.ex===ex}).forEach(function(x){var e=e1(x.kg,x.reps);if(!m[x.d]||e>m[x.d])m[x.d]=e});
return Object.keys(m).sort().map(function(d){return{d:d,e:m[d]}})}
function status(ss){if(ss.length<2)return{t:"Need more sessions",c:"mu",pct:null};
var n=ss.length,k=Math.min(3,Math.ceil(n/2)),rec=avg(ss.slice(n-k).map(function(x){return x.e})),pr=ss.slice(Math.max(0,n-2*k),n-k),pv=avg(pr.map(function(x){return x.e})),p=(rec-pv)/pv*100;
if(p>=1.5)return{t:"Getting stronger",c:"up",pct:p};if(p<=-1.5)return{t:"Losing strength",c:"dn",pct:p};return{t:"Holding steady",c:"fl",pct:p}}
function vLifts(){
var exs=[];S.l.forEach(function(x){if(exs.indexOf(x.ex)<0)exs.push(x.ex)});
var h='<div class="card"><h2>Log a set</h2><div class="f"><label for="le">Exercise</label><input id="le" list="exl" placeholder="e.g. Bench press" oninput="exu()"><datalist id="exl">'+exs.map(function(e){return'<option value="'+esc(e)+'">'}).join("")+'</datalist></div><div class="row"><div class="f"><label for="lk">Weight</label><input id="lk" type="number" inputmode="decimal" step="any" oninput="lh()"></div><div class="f" style="flex:0 0 84px"><label for="lu">Unit</label><select id="lu" onchange="lh()">'+opt("kg",S.st.lu,"kg")+opt("lb",S.st.lu,"lb")+'</select></div><div class="f"><label for="lr">Reps</label><input id="lr" type="number" inputmode="numeric" oninput="lh()"></div></div><p class="mu" id="lh" style="margin:0 0 8px"></p>'+plcard()+'<div class="f"><label for="ld">Date</label><input id="ld" type="date" value="'+td()+'"></div><button class="p" style="width:100%" onclick="addL()">Save set</button></div>';
if(!exs.length)return h+'<p class="empty">Log sets for each lift. Progress is judged on estimated one-rep max across sessions.</p>';

var h='<div class="card"><div class="row"><div class="f"><label for="ps">Sex</label><select id="ps" onchange="sp(\'sex\',this.value)">'+opt("m",p.sex,"Male")+opt("f",p.sex,"Female")+'</select></div><div class="f"><label for="pa">Age</label><input id="pa" type="number" value="'+p.age+'" onchange="sp(\'age\',this.value)"></div><div class="f"><label for="ph">Height (cm)</label><input id="ph" type="number" value="'+p.h+'" onchange="sp(\'h\',this.value)"></div></div>'+
'<div class="f"><label for="pc">Activity level</label><select id="pc" onchange="sp(\'act\',this.value)">'+opt(1.2,p.act,"Sedentary")+opt(1.375,p.act,"Light, 1 to 3 workouts a week")+opt(1.55,p.act,"Moderate, 3 to 5 workouts a week")+opt(1.725,p.act,"Heavy, 6 to 7 workouts a week")+opt(1.9,p.act,"Very heavy, physical job plus training")+'</select></div>'+
'<div class="row"><div class="f"><label for="pg">Goal</label><select id="pg" onchange="sp(\'goal\',this.value)">'+opt("lose",p.goal,"Lose weight")+opt("maintain",p.goal,"Maintain")+opt("gain",p.goal,"Gain weight")+'</select></div><div class="f"><label for="pr">Rate ('+bu()+' per week)</label><input id="pr" type="number" inputmode="decimal" step="0.05" min="0.05" value="'+Math.round(bv(p.rate)*100)/100+'" onchange="sr(this.value)"><span class="mu">'+(t?r1(p.rate/t.w*100)+'% of bodyweight per week'+(p.rate/t.w>.01&&p.goal==="lose"?'. Above 1% is unhealthy.':''):'Common range: 0.25 to 1')+'</span></div></div>'+
'<div class="f"><label for="pp">Protein (g per kg bodyweight)</label><input id="pp" type="number" step="0.1" value="'+p.ppk+'" onchange="sp(\'ppk\',this.value)"></div></div>';
h+=t?'<div class="card"><h2>Your numbers</h2><div class="li"><span>Weight used</span><b>'+bs(t.w)+'</b></div><div class="li"><span>Resting energy (BMR)</span><b>'+Math.round(t.bmr)+' kcal</b></div><div class="li"><span>Maintenance (TDEE)</span><b>'+Math.round(t.tdee)+' kcal</b></div><div class="li"><span>Daily calorie target</span><b>'+Math.round(t.target)+' kcal</b></div><div class="li"><span>Daily protein target</span><b>'+Math.round(t.prot)+' g</b></div><p class="mu" style="margin:8px 0 0">Mifflin-St Jeor estimate. Targets use your latest logged weight and 7,700 kcal per kg of change. Adjust based on real trend.</p></div>':'<div class="card"><p style="margin:0">Log a weight to see your calorie and protein targets.</p></div>';
h+=adapt();return h}
var AC={blue:["#3b5b8c","#e8eef7","#8fb0e3","#243044"],green:["#2f7d4f","#e6f3eb","#6cc58f","#1f3a2b"],purple:["#6b4fa0","#efe9f8","#b9a2e8","#2f2742"],orange:["#b5611a","#faeee2","#f0a45a","#3d2c1c"]};
function apply(){var r=document.documentElement,t=S.st.theme;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);
var dk=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches),a=AC[S.st.ac]||AC.blue,i=dk?2:0;
r.style.setProperty("--ac",a[i]);r.style.setProperty("--ac2",a[i+1]);document.body.classList.toggle("noanim",!S.st.anim)}
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",apply)}catch(e){}
function sg2(k,o){return'<div class="seg">'+o.map(function(x){return'<button class="'+(String(S.st[k])===x[0]?"on":"")+'" onclick="sset(\''+k+'\',\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+'</div>'}
function sset(k,v){S.st[k]=(v==="0"||v==="1")?+v:v;save();apply();render()}

function rst(){if(confirm("Erase all weights, lifts, foods and logs on this device?")){try{localStorage.removeItem(K)}catch(e){}location.reload()}}
function vSet(){var s=S.st,KL=[["kg","kg"],["lb","lb"]],OO=function(k){return sg2(k,[["1","On"],["0","Off"]])};
return'<div class="card"><h2>Units</h2><label>Body weight</label>'+sg2("bu",KL)+'<label>Default for new exercises</label>'+sg2("lu",KL)+'<p class="mu" style="margin:0">Each exercise remembers its own unit. Switch it any time from its card in Strength.</p></div>'+
'<div class="card"><h2>Appearance</h2><label>Theme</label>'+sg2("theme",[["auto","Auto"],["light","Light"],["dark","Dark"]])+'<label>Accent color</label><div class="sw">'+Object.keys(AC).map(function(k){return'<button aria-label="'+k+'" class="'+(s.ac===k?"on":"")+'" style="background:'+AC[k][0]+'" onclick="sset(\'ac\',\''+k+'\')"></button>'}).join("")+'</div></div>'+
'<div class="card"><h2>Behavior</h2><label>Weekly health warnings</label>'+OO("warn")+'<label>Animations</label>'+OO("anim")+'<label>Rest timer after each set</label>'+sg2("rest",[["0","Off"],["60","60s"],["90","90s"],["120","2m"],["180","3m"]])+'</div>'+
'<div class="card"><h2>Data</h2><p class="mu" style="margin:0 0 10px">Everything is stored on this device only. Last backup: '+(S.st.bk?new Date(S.st.bk).toLocaleDateString():"never")+'.</p><div class="row"><button onclick="expo()">Export backup</button><input type="file" accept=".json,application/json" style="display:none" onchange="impo(this)"><button onclick="this.previousElementSibling.click()">Import backup</button></div><button style="width:100%;margin-top:8px" onclick="tut(0)">Replay tutorial</button><button style="width:100%;margin-top:8px;color:var(--bad)" onclick="rst()">Erase all data</button></div>'}

function ema(v){var k=.25,o=[];v.forEach(function(x,i){o.push(i?o[i-1]+k*(x-o[i-1]):x)});return o}
/* backup */
function expo(){S.st.bk=Date.now();save();var f=new File([JSON.stringify(S)],"baseline-backup-"+td()+".json",{type:"application/json"});
if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(function(){});else{var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()}render()}
function impo(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.p||!o.w||!o.foods)throw 0;if(!confirm("Replace all current data with this backup?"))return;localStorage.setItem(K,JSON.stringify(o));location.reload()}catch(e){alert("That file is not a valid Baseline backup.")}};r.readAsText(f)}
function bkb(){var d=Math.floor((Date.now()-(S.st.bk||S.st.since))/864e5);if(d<14||!(S.w.length||S.l.length||S.log.length))return"";
return'<div class="alert" style="--c:var(--org)"><i class="dot"></i><div><b>Back up your data</b><span>'+(S.st.bk?"It has been "+d+" days since your last backup.":"You have not backed up yet.")+'</span><br><button onclick="expo()">Back up now</button></div></div>'}
/* rest timer */
var RT=null,RE=0,AU=null;
function beep(){try{var o=AU.createOscillator(),g=AU.createGain();o.connect(g);g.connect(AU.destination);g.gain.value=.15;o.frequency.value=880;o.start();o.stop(AU.currentTime+.3)}catch(e){}}
function rest(sec){clearInterval(RT);try{AU=AU||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}RE=Date.now()+sec*1000;var el=$("rt");el.className="on";
el.innerHTML='<b id="rtl"></b><span>'+[60,90,120,180].map(function(x){return'<button onclick="rest('+x+')">'+(x<120?x+"s":x/60+"m")+'</button>'}).join("")+'<button onclick="rtx()" aria-label="Stop timer">x</button></span>';rtu();RT=setInterval(rtu,250)}
function rtu(){var l=Math.ceil((RE-Date.now())/1000),e=$("rtl");if(!e)return;if(l<=0){clearInterval(RT);e.textContent="Rest over. Next set.";try{navigator.vibrate([250,100,250])}catch(x){}beep();return}e.textContent="Rest "+Math.floor(l/60)+":"+String(l%60).padStart(2,"0")}
function rtx(){clearInterval(RT);$("rt").className="";$("rt").innerHTML=""}
/* plates and last session */
function plcard(){var kg=S.st.lu==="kg",pl=kg?[25,20,15,10,5,2.5,1.25]:[45,35,25,10,5,2.5],bars=kg?[20,15]:[45,35];
return'<details style="margin:0 0 10px"><summary class="mu">Plate calculator</summary><div class="row" style="margin-top:8px"><div class="f"><label for="pt">Target ('+S.st.lu+')</label><input id="pt" type="number" inputmode="decimal" oninput="plc()"></div><div class="f"><label for="pb">Bar</label><select id="pb" onchange="plc()">'+bars.map(function(b){return'<option>'+b+'</option>'}).join("")+'</select></div></div><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px">'+pl.map(function(p){return'<label style="display:flex;gap:4px;align-items:center;margin:0"><input type="checkbox" class="pp" style="width:auto" value="'+p+'" checked onchange="plc()">'+p+'</label>'}).join("")+'</div><div id="plr"></div></details>'}
function plc(){var t=num("pt")||num("lk"),b=+$("pb").value,o=$("plr"),av=[].slice.call(document.querySelectorAll(".pp:checked")).map(function(x){return+x.value}).sort(function(x,y){return y-x});
if(!(t>0)){o.innerHTML="";return}if(t<b){o.innerHTML='<p class="mu">Target is below the bar ('+b+').</p>';return}
var side=(t-b)/2,st=[];av.forEach(function(p){while(side>=p-1e-9){st.push(p);side-=p}});
var got=b+2*st.reduce(function(a,x){return a+x},0),mx=Math.max.apply(0,av.concat([1]));
o.innerHTML='<div style="display:flex;align-items:center;gap:2px;margin:6px 0"><i style="width:34px;height:8px;background:var(--mu);border-radius:3px"></i>'+st.map(function(p){return'<i title="'+p+'" style="width:'+(8+p/mx*10)+'px;height:'+(22+p/mx*56)+'px;background:var(--ac);border-radius:3px"></i>'}).join("")+'</div><p class="mu" style="margin:0">Per side: '+(st.length?st.join(" + "):"no plates")+'. Loaded: '+r1(got)+' '+S.st.lu+(Math.abs(got-t)>.01?" (closest without going over)":"")+'.</p>'}
function lh(){var e=$("le").value.trim(),u=$("lu").value,L=S.l.filter(function(x){return x.ex===e}),h="";
if(L.length){var m=L[0];L.forEach(function(x){if(x.d>=m.d)m=x});h="Last: "+r1(lv(m.kg,u))+" "+u+" x "+m.reps+" ("+lab(m.d)+")";$("lk").placeholder=r1(lv(m.kg,u));$("lr").placeholder=m.reps}
var k=num("lk"),r=num("lr");if(k>=0&&r>0)h+=(h?" | ":"")+"Est. 1RM "+r1(e1(k,r))+" "+u;$("lh").textContent=h;plc()}
/* meals, water, creatine */
function mealCard(){var h='<div class="card"><h2>Quick add</h2><div class="row"><button onclick="cpy()">Copy previous day</button><button onclick="svm()">Save day as meal</button></div>';
h+=S.meals.length?S.meals.map(function(m,i){var k=0;m.items.forEach(function(x){var f=foodOf(x.fid);if(f)k+=f.k*x.g/100});return'<div class="li"><div>'+esc(m.n)+'<br><span class="mu">'+m.items.length+' foods, '+Math.round(k)+' kcal</span></div><div><button class="p" onclick="addM('+i+')">Add</button><button class="x" onclick="delM('+i+')">Delete</button></div></div>'}).join(""):'<p class="mu" style="margin:8px 0 0">Log a meal on a day, then tap Save day as meal to reuse it in one tap.</p>';return h+'</div>'}
function cpy(){var p=addD(nd,-1),it=S.log.filter(function(x){return x.d===p});if(!it.length){alert("Nothing was logged the day before.");return}if(!confirm("Copy "+it.length+" items from the previous day?"))return;it.forEach(function(x){S.log.push({id:uid(),d:nd,fid:x.fid,g:x.g})});save();render()}
function svm(){var it=S.log.filter(function(x){return x.d===nd});if(!it.length){alert("Log some foods for this day first.");return}var n=prompt("Name this meal");if(!n||!n.trim())return;S.meals.push({id:uid(),n:n.trim(),items:it.map(function(x){return{fid:x.fid,g:x.g}})});save();render()}
function addM(i){S.meals[i].items.forEach(function(x){if(foodOf(x.fid))S.log.push({id:uid(),d:nd,fid:x.fid,g:x.g})});save();render()}
function delM(i){if(confirm("Delete this meal?")){S.meals.splice(i,1);save();render()}}
function dy(){return S.day[nd]||(S.day[nd]={w:0,c:0})}
function hyc(){var d=S.day[nd]||{w:0,c:0};return'<div class="card"><h2>Hydration and creatine</h2><div class="row" style="align-items:center"><div><span class="mu">Water (goal 2.5 L)</span><div class="big">'+Math.round(d.w/10)/100+' <span class="mu">L</span></div></div><div style="display:flex;gap:6px;justify-content:flex-end"><button onclick="wat(-250)" aria-label="Less water">-250</button><button class="p" onclick="wat(250)">+250 ml</button></div></div><div class="bar"><i style="width:'+Math.min(100,d.w/25)+'%"></i></div><label style="display:flex;gap:8px;align-items:center;margin:10px 0 0"><input type="checkbox" style="width:auto" '+(d.c?"checked":"")+' onchange="cre(this.checked)">Creatine taken</label><p class="mu" style="margin:6px 0 0">Creatine pulls water into muscle, so a 0.5 to 1 kg scale bump early on is normal. Judge fat loss by the trend line.</p></div>'}
function wat(n){var d=dy();d.w=Math.max(0,d.w+n);save();render()}
function cre(v){dy().c=v?1:0;save();render()}
/* recipe builder */
var RB={n:"",w:"",it:[]};
function rbc(){var o={k:0,p:0,c:0,f:0};RB.it.forEach(function(x){var f=foodOf(x.fid);if(f){var m=x.g/100;o.k+=f.k*m;o.p+=f.p*m;o.c+=f.c*m;o.f+=f.f*m}});return o}
function rbcard(){return'<div class="card"><h2>Recipe builder</h2><p class="mu" style="margin:0 0 8px">Add raw ingredients once, enter the total cooked weight, and save the dish as a food with exact per-100 g macros.</p><div class="f"><label for="rn">Dish name</label><input id="rn" value="'+esc(RB.n)+'" oninput="RB.n=this.value"></div><div class="row"><div class="f"><label for="ri">Ingredient</label><input id="ri" list="rl" placeholder="Search food"><datalist id="rl">'+S.foods.map(function(f){return'<option value="'+esc(f.n)+'">'}).join("")+'</datalist></div><div class="f" style="flex:0 0 90px"><label for="rg">Raw g</label><input id="rg" type="number" inputmode="decimal"></div></div><button style="width:100%" onclick="rba()">Add ingredient</button>'+
RB.it.map(function(x,i){var f=foodOf(x.fid);return f?'<div class="li"><div>'+esc(f.n)+'<br><span class="mu">'+x.g+' g raw, '+Math.round(f.k*x.g/100)+' kcal</span></div><div><button class="x" onclick="RB.it.splice('+i+',1);render()">Remove</button></div></div>':""}).join("")+
'<div class="f" style="margin-top:10px"><label for="rw">Total cooked weight (g)</label><input id="rw" type="number" inputmode="decimal" value="'+esc(RB.w)+'" oninput="RB.w=this.value;rbp()"></div><p class="mu" id="rp" style="margin:0 0 8px"></p><button class="p" style="width:100%" onclick="rbs()">Save as food</button></div>'}
function rbp(){var e=$("rp");if(!e)return;var o=rbc(),w=parseFloat(RB.w);e.textContent=RB.it.length&&w>0?"Per 100 g: "+Math.round(o.k*100/w)+" kcal, "+r1(o.p*100/w)+" g protein, "+r1(o.c*100/w)+" g carbs, "+r1(o.f*100/w)+" g fat. Whole dish: "+Math.round(o.k)+" kcal.":""}
function rba(){var n=$("ri").value.trim().toLowerCase(),g=num("rg"),f=S.foods.filter(function(x){return x.n.toLowerCase()===n})[0]||S.foods.filter(function(x){return n&&x.n.toLowerCase().indexOf(n)>=0})[0];if(!f||!(g>0)){alert("Pick an ingredient from the list and enter its raw grams.");return}RB.it.push({fid:f.id,g:g});render()}
function rbs(){var o=rbc(),w=parseFloat(RB.w);if(!RB.n.trim()||!RB.it.length||!(w>0)){alert("Add a name, ingredients and the total cooked weight.");return}S.foods.push({id:uid(),n:RB.n.trim(),k:o.k*100/w,p:o.p*100/w,c:o.c*100/w,f:o.f*100/w,s:100});RB={n:"",w:"",it:[]};save();render()}
/* adaptive maintenance */
function adapt(){var W=21,a=S.w.filter(function(x){return x.d>addD(td(),-W)}).sort(function(x,y){return x.d<y.d?-1:1}),ks=[];
for(var j=0;j<W;j++){var k=dayTot(addD(td(),-j)).k;if(k>0)ks.push(k)}
var span=a.length>1?(pd(a[a.length-1].d)-pd(a[0].d))/864e5:0,h='<div class="card"><h2>Adaptive maintenance</h2>';
if(a.length<4||span<14||ks.length<10)return h+'<p class="mu" style="margin:0">Unlocks after about 2 weeks of data: 4 or more weigh-ins across 14 days and 10 days of logged food. So far: '+Math.floor(span)+' of 14 days weighed, '+ks.length+' of 10 days logged.</p></div>';
var em=ema(a.map(function(x){return x.kg})),wk=(em[em.length-1]-em[0])/span*7,ai=avg(ks),m=ai-wk*7700/7,t=T();
return h+'<div class="li"><span>Avg logged intake</span><b>'+Math.round(ai)+' kcal</b></div><div class="li"><span>Trend change</span><b>'+(wk>0?"+":"")+r1(bv(wk))+' '+bu()+' a week</b></div><div class="li"><span>Estimated maintenance</span><b>'+Math.round(m)+' kcal</b></div>'+(t?'<p class="mu" style="margin:8px 0">Formula estimate: '+Math.round(t.bmr*S.p.act)+' kcal.</p>':'')+'<div class="row"><button class="p" onclick="S.p.tdeeO='+Math.round(m)+';save();render()">Use for my targets</button>'+(S.p.tdeeO>0?'<button onclick="S.p.tdeeO=0;save();render()">Use formula</button>':'')+'</div><p class="mu" style="margin:8px 0 0">Average intake minus 7,700 kcal per kg of trend change. It is only as accurate as your logging.</p></div>'}
function render(){var T0={weight:["Weight",vWeight],lifts:["Strength",vLifts],food:["Intake",vFood],db:["Foods",vDb],me:["Profile",vMe],set:["Settings",vSet]}[tab];
$("t").textContent=T0[0];$("v").className="";$("v").innerHTML=bkb()+T0[1]();if(tab==="db"){lst();rbp()}
$("nav").innerHTML=TABS.map(function(x){return'<button class="'+(tab===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')"><svg viewBox="0 0 24 24"><path d="'+IC[x[0]]+'"/></svg>'+x[1]+'</button>'}).join("")}
render();
apply();if(!S.seen)tut(0);
</script>
